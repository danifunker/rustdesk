# Fork-only workflow: build the consent-free Wayland variant, rebranded as R-DeskWay (the
# DRM/KMS capture backend) for BOTH x86_64 and aarch64 and publish the debs to a GitHub release.
#
# Upstream builds this variant only for x86_64, in the `build-rustdesk-linux-drm` job of
# flutter-build.yml. This file is that job, lifted verbatim, with the aarch64 arm of upstream's
# regular `build-rustdesk-linux` job merged in (native ubuntu-22.04-arm runner, flutter-elinux,
# arm64 vcpkg triplet). Keep it in step with those two jobs when syncing from upstream.
#
# The variant is deb-only by design (build.py refuses --drm on the rpm/pacman paths), so this
# workflow produces the rebranded R-DeskWay packages: r-deskway-<ver>-{x86_64,aarch64}.deb, the
# matching rpms, and an x86_64 Arch package. The binary/service/config dir stay `rustdesk` so it is
# a settings-preserving drop-in that conflicts with/replaces the stock package; only the package
# identity, maintainer, launcher and icon are rebranded, all via fork-only files (rebase-safe).
name: Linux unattended-wayland (DRM) build

# workflow_dispatch only registers once the file exists on the default branch, so while this lives on
# its own branch the push trigger below is what runs it: every push to that branch builds both debs
# and attaches them to a DRAFT pre-release named <version>-unattended-wayland (nothing public until
# you press Publish). Merge to master to get the "Run workflow" button with the inputs.
on:
  push:
    branches: [unattended-wayland-ci]
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Publish the debs to this GitHub release tag (created at this commit if missing). Empty = workflow artifacts only."
        type: string
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true
      draft:
        description: "Create the release as a draft (nothing is public until you press Publish)"
        type: boolean
        default: true

env:
  # Same pins as upstream flutter-build.yml. Bump them together with upstream.
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-unattended-wayland:
    needs: [generate-bridge]
    name: build R-DeskWay ${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.on }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: x86_64,
              target: x86_64-unknown-linux-gnu,
              distro: ubuntu18.04,
              on: ubuntu-22.04,
              deb_arch: amd64,
              vcpkg-triplet: x64-linux,
            }
          - {
              arch: aarch64,
              target: aarch64-unknown-linux-gnu,
              distro: ubuntu18.04,
              on: ubuntu-22.04-arm,
              deb_arch: arm64,
              vcpkg-triplet: arm64-linux,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm
          if [[ "${{ matrix.job.arch }}" == "x86_64" ]]; then
            sudo apt-get install -y qemu-user-static
          fi

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set Swap Space
        if: ${{ matrix.job.arch == 'x86_64' }}
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Free Space
        run: |
          df -h
          free -m

      - name: Read version from Cargo.toml
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "building R-DeskWay (r-deskway) $VERSION for ${{ matrix.job.arch }}"
          # Release settings: dispatch inputs win; a push to the branch always goes to a draft
          # pre-release (inputs are empty on push, and an empty `draft` would mean "public").
          RELEASE_TAG="${{ inputs.release-tag }}"
          DRAFT="${{ inputs.draft }}"
          PRERELEASE="${{ inputs.prerelease }}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            RELEASE_TAG="${VERSION}-unattended-wayland"
            DRAFT=true
            PRERELEASE=true
          fi
          [[ "$DRAFT" == "false" ]] || DRAFT=true
          [[ "$PRERELEASE" == "false" ]] || PRERELEASE=true
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "DRAFT=$DRAFT" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          echo "release: tag='$RELEASE_TAG' draft=$DRAFT prerelease=$PRERELEASE"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

      - name: Disable rust bridge build
        run: |
          # only build cdylib
          sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      # aarch64 only. vcpkg runs with VCPKG_FORCE_SYSTEM_BINARIES=1 on arm64 hosts, so instead of
      # fetching its own CMake 4.4.0 (as it does on x86_64) it uses the runner's system cmake, which is
      # too old for the `string(JSON ... STRING_ENCODE)` call in vcpkg's z_vcpkg_spdx.cmake at the
      # pinned VCPKG_COMMIT_ID. Every port then fails to configure. Upstream's own nightly aarch64 job
      # fails the same way. Install the CMake vcpkg would have fetched, first on PATH.
      - name: Install CMake 4.4.0 (aarch64 vcpkg needs it)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: |
          set -euo pipefail
          url=https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-linux-aarch64.tar.gz
          curl -sSL --retry 5 -o /tmp/cmake.tar.gz "$url"
          echo "e98bb53e0b00a8f672424517d34c05bb9b94fd1c888c89e0b81bc8df51d1a94b  /tmp/cmake.tar.gz" | sha256sum -c -
          sudo rm -rf /opt/cmake && sudo mkdir -p /opt/cmake
          sudo tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          echo "/opt/cmake/bin" >> "$GITHUB_PATH"
          /opt/cmake/bin/cmake --version
        shell: bash

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      # The container's meson is too old to build libdrmtap, so build it here on the runner (natively,
      # so the .so matches the runner's arch) from the pin in build.py and hand it to the container
      # below via DRMTAP_PREBUILT_DIR.
      - name: Build libdrmtap
        run: |
          sudo apt-get install -y meson ninja-build pkg-config \
            libdrm-dev libegl1-mesa-dev libgles2-mesa-dev
          python3 - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("b", "build.py")
          b = importlib.util.module_from_spec(spec)
          sys.argv = ["build.py"]
          spec.loader.exec_module(b)
          print(f"::notice::built {b.build_libdrmtap_so()}")
          PY
          file third_party/libdrmtap/build-pkg/libdrmtap.so.0.*
        shell: bash

      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8 # no release tag; commit 2026-05-26
        name: Build rustdesk
        id: vcpkg
        with:
          arch: ${{ matrix.job.arch }}
          distro: ${{ matrix.job.distro }}
          githubToken: ${{ github.token }}
          setup: |
            ls -l "${PWD}"
            ls -l /opt/artifacts/vcpkg/installed
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            echo -e "installing deps"
            apt-get install -y \
               build-essential \
               clang \
               cmake \
               curl \
               gcc \
               git \
               g++ \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libclang-10-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-10-dev \
               nasm \
               ninja-build \
               pkg-config \
               tree \
               python3 \
               rpm \
               unzip \
               wget \
               xz-utils \
               libssl-dev
            # we have libopus compiled by us.
            apt-get remove -y libopus-dev || true
            # output devs
            ls -l ./
            tree -L 3 /opt/artifacts/vcpkg/installed
          run: |
            # disable git safe.directory
            git config --global --add safe.directory "*"
            # rust
            pushd /opt
            # do not use rustup, because memory overflow in qemu
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}.tar.gz
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }} && ./install.sh
            rm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}
            # edit config
            mkdir -p ~/.cargo/
            echo """
              [source.crates-io]
              registry = 'https://github.com/rust-lang/crates.io-index'
            """ > ~/.cargo/config
            cat ~/.cargo/config
            # start build
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            if [[ "${{ matrix.job.arch }}" == "aarch64" ]]; then
              export JOBS="--jobs 3"
            else
              export JOBS=""
            fi
            echo $JOBS
            # use the .so built on the runner; build.py checks it is the pinned checkout
            export DRMTAP_PREBUILT_DIR=/workspace/third_party/libdrmtap/build-pkg
            # ask build.py for the features so this line and the packaging line cannot drift
            FEATURES=$(python3 ./build.py --flutter --drm --hwcodec --unix-file-copy-paste --print-features)
            # an empty or error-shaped value would silently build a stock binary
            for want in drm drm-wake; do
              case ",$FEATURES," in
                *",$want,"*) ;;
                *) echo "::error::build.py returned no '$want' feature: $FEATURES"; exit 1 ;;
              esac
            done
            cargo build --locked --lib $JOBS --features "$FEATURES" --release
            rm -rf target/release/deps target/release/build
            rm -rf ~/.cargo

            # Setup Flutter
            # disable git safe.directory
            git config --global --add safe.directory "*"
            pushd /workspace
            case ${{ matrix.job.arch }} in
              aarch64)
                export PATH=/opt/flutter-elinux/bin:$PATH
                sed -i "s/flutter build linux --release/flutter-elinux build linux --verbose/g" ./build.py
                sed -i "s/x64\/release/arm64\/release/g" ./build.py
              ;;
              x86_64)
                export PATH=/opt/flutter/bin:$PATH
              ;;
            esac
            popd
            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            case ${{ matrix.job.arch }} in
              aarch64)
                # clone repo and reset to flutter ${{ env.FLUTTER_VERSION }}
                git clone https://github.com/sony/flutter-elinux.git || true
                pushd flutter-elinux
                  git fetch
                  git reset --hard ${{ env.FLUTTER_VERSION }}
                  bin/flutter-elinux doctor -v
                  bin/flutter-elinux precache --linux
                popd
                cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64
                rm -rf flutter
              ;;
              x86_64)
                flutter doctor -v
              ;;
            esac

            if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
              case ${{ matrix.job.arch }} in
                aarch64)
                  pushd /opt/flutter-elinux/flutter
                ;;
                x86_64)
                  pushd /opt/flutter
                ;;
              esac
              git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
              popd
            fi

            # build flutter
            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=${{ matrix.job.deb_arch }}
            python3 ./build.py --flutter --drm --hwcodec --unix-file-copy-paste --skip-cargo
            for name in rustdesk*??.deb; do
              mv "$name" "${name%%.deb}-${{ matrix.job.arch }}.deb"
            done

      - name: Rebrand deb to R-DeskWay
        # Fork-only: post-process the stock-built deb (rustdesk-unattended-wayland) into the rebranded
        # R-DeskWay package -- rename, fork maintainer/homepage, rusty icon, R-DeskWay launcher. Leaves
        # build.py and every upstream file untouched, so the branch keeps rebasing cleanly.
        run: |
          set -euo pipefail
          shopt -s nullglob
          ins=(rustdesk-unattended-wayland-*-${{ matrix.job.arch }}.deb)
          if [ "${#ins[@]}" -ne 1 ]; then
            echo "::error::expected one stock drm deb to rebrand, found ${#ins[@]}: ${ins[*]-none}"; exit 1
          fi
          out="r-deskway-${VERSION}-${{ matrix.job.arch }}.deb"
          bash branding/rebrand-deb.sh "${ins[0]}" "${{ matrix.job.deb_arch }}" "$out"
          rm -f "${ins[0]}"   # never ship the stock-named deb
        shell: bash

      # build.py can exit 0 on some inner failures, so check the artifact rather than the status.
      # The package name is the informed consent for consent-free capture, so a stock binary must
      # never ship under it: assert the bundled library AND the dlopen path in the binary.
      - name: Check the deb is a drm build
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(r-deskway-*-${{ matrix.job.arch }}.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::expected one r-deskway-*-${{ matrix.job.arch }}.deb, found ${#debs[@]}: ${debs[*]-none}"
            exit 1
          fi
          deb="${debs[0]}"
          # the rebrand must have taken: fork identity, not the stock rustdesk one
          [ "$(dpkg-deb -f "$deb" Package)" = "r-deskway" ] || { echo "::error::$deb Package is not r-deskway"; exit 1; }
          dpkg-deb -f "$deb" Maintainer | grep -qF "dani@funkervogt.com" || { echo "::error::$deb maintainer not rebranded"; exit 1; }
          dpkg-deb -I "$deb"
          contents="$(dpkg -c "$deb")"
          if [[ ! "$contents" =~ usr/lib/rustdesk/libdrmtap\.so\.0\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::$deb has no versioned libdrmtap.so.0.x.y"
            exit 1
          fi
          if [[ "$contents" != *"usr/lib/rustdesk/libdrmtap.so.0 ->"* ]]; then
            echo "::error::$deb has no libdrmtap.so.0 soname symlink"
            exit 1
          fi
          rm -rf /tmp/deb && dpkg-deb -R "$deb" /tmp/deb
          if ! grep -qF /usr/lib/rustdesk/libdrmtap.so.0 /tmp/deb/usr/share/rustdesk/lib/librustdesk.so; then
            echo "::error::$deb was not built with the drm feature"
            exit 1
          fi
          # The package must be for the arch it says it is for.
          file /tmp/deb/usr/share/rustdesk/lib/librustdesk.so /tmp/deb/usr/lib/rustdesk/libdrmtap.so.0.* /tmp/deb/usr/share/rustdesk/rustdesk
          want="${{ matrix.job.deb_arch }}"
          got="$(dpkg-deb -f "$deb" Architecture)"
          if [[ "$got" != "$want" ]]; then
            echo "::error::$deb declares Architecture: $got, expected $want"
            exit 1
          fi
          sha256sum "$deb" | tee "$deb.sha256"
          # Only now that every check passed does the deb become publishable.
          echo "DRM_DEB=$deb" >> "$GITHUB_ENV"
        shell: bash

      - name: Build and verify the DRM rpm (Fedora)
        # Build the rpm on the runner host, reusing the flutter bundle + libdrmtap the container build
        # already left in the workspace. build.py refuses --drm on the rpm path by design (only the deb
        # branch bundles libdrmtap and renames the package), so we drive rpmbuild directly with a
        # DRM-aware spec that keeps the rename to r-deskway + Conflicts: rustdesk discipline.
        # Build AND verify in one step, and only export DRM_RPM at the very end, so an unverified rpm
        # is never publishable by the always()-gated upload/publish steps below.
        if: env.DRM_DEB != ''
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y rpm cpio file
          spec=res/rpm-flutter-drm.spec
          if [ "${{ matrix.job.arch }}" = "aarch64" ]; then
            sed -i "s#linux/x64#linux/arm64#g" "$spec"
          fi
          HBB="$(pwd)" rpmbuild --define "_topdir $HOME/rpmbuild" --target ${{ matrix.job.arch }} -bb "$spec"
          rpm="$(find "$HOME/rpmbuild/RPMS" -name 'r-deskway-*.rpm' | head -1)"
          if [ -z "$rpm" ]; then echo "::error::rpmbuild produced no rpm"; exit 1; fi
          cp "$rpm" "./$(basename "$rpm")"; rpm="$(basename "$rpm")"
          rpm -qip "$rpm" || true
          got="$(rpm -qp --qf '%{ARCH}' "$rpm")"
          if [ "$got" != "${{ matrix.job.arch }}" ]; then
            echo "::error::$rpm is arch $got, expected ${{ matrix.job.arch }}"; exit 1
          fi
          if ! rpm -qp --conflicts "$rpm" | grep -qx rustdesk; then
            echo "::error::$rpm does not Conflict: rustdesk (the distinct name is the informed consent)"; exit 1
          fi
          list="$(rpm -qlp "$rpm")"
          echo "$list" | grep -qE '/usr/lib/rustdesk/libdrmtap\.so\.0\.[0-9]+\.[0-9]+' || { echo "::error::$rpm has no versioned libdrmtap"; exit 1; }
          echo "$list" | grep -qx '/usr/lib/rustdesk/libdrmtap.so.0' || { echo "::error::$rpm has no libdrmtap.so.0 symlink"; exit 1; }
          rpmabs="$(pwd)/$rpm"
          rm -rf /tmp/rpm && mkdir /tmp/rpm && ( cd /tmp/rpm && rpm2cpio "$rpmabs" | cpio -idm --quiet )
          file /tmp/rpm/usr/share/rustdesk/lib/librustdesk.so /tmp/rpm/usr/lib/rustdesk/libdrmtap.so.0.*
          grep -qF /usr/lib/rustdesk/libdrmtap.so.0 /tmp/rpm/usr/share/rustdesk/lib/librustdesk.so || { echo "::error::$rpm binary is not a drm build"; exit 1; }
          sha256sum "$rpm" | tee "$rpm.sha256"
          echo "DRM_RPM=$rpm" >> "$GITHUB_ENV"
        shell: bash

      - name: Build the Arch package (x86_64)
        # x86_64 only, matching upstream: there is no current arm64 Arch image and arm64 makepkg fails
        # under emulation. Reuses the same flutter bundle + libdrmtap via HBB.
        if: env.DRM_DEB != '' && matrix.job.arch == 'x86_64'
        uses: rustdesk-org/arch-makepkg-action@04200739ed1d0bf6f2188b6736b26a767c57a7f9 # no release tag; commit 2026-05-26
        with:
          packages:
          scripts: |
            cd res && HBB=`pwd`/.. FLUTTER=1 PACKAGER="Dani Sarfati <dani@funkervogt.com>" makepkg -p PKGBUILD-drm -f

      - name: Upload raw Arch package (debug aid)
        # Always keep the makepkg output as a workflow artifact, even if the check below fails, so it
        # can be inspected without a full rebuild. Not published to the release (that needs the check).
        if: always() && matrix.job.arch == 'x86_64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-pkg-raw-x86_64
          path: res/r-deskway-*-x86_64.pkg.tar.zst
          if-no-files-found: ignore

      - name: Check the Arch package (x86_64)
        if: env.DRM_DEB != '' && matrix.job.arch == 'x86_64'
        run: |
          set -euo pipefail
          sudo apt-get install -y zstd file
          # makepkg ran as root inside the arch-makepkg-action container and left the workspace root
          # (and .git) root-owned, so this step could not write the .sha256 and the post-job git
          # cleanup failed. Reclaim ownership of what we write.
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/.git" || true
          shopt -s nullglob
          pkgs=()
          for p in res/r-deskway-*-x86_64.pkg.tar.zst; do
            # makepkg can emit a -debug- companion package; the release ships only the real one.
            [[ "$p" == *-debug-* ]] || pkgs+=("$p")
          done
          if [ "${#pkgs[@]}" -ne 1 ]; then
            echo "::error::expected one Arch pkg, found ${#pkgs[@]}: ${pkgs[*]-none}"; exit 1
          fi
          # makepkg ran as root inside a container, so the .pkg is root-owned in res/. Copy it out to
          # the (runner-owned) workspace root with sudo and take ownership, so the rest of this step
          # and the always()-gated upload/publish can read and sit beside it.
          src="${pkgs[0]}"
          pkg="$(basename "$src")"
          sudo cp "$src" "./$pkg"
          sudo chown "$(id -u):$(id -g)" "./$pkg"
          # Extract the whole package once, rather than named members (whose exact path prefix could
          # differ and fail the extraction hard), then verify against the extracted tree.
          rm -rf /tmp/arch && mkdir /tmp/arch
          tar --use-compress-program=unzstd -xf "$pkg" -C /tmp/arch
          find /tmp/arch/usr/lib/rustdesk -regextype posix-extended -regex '.*/libdrmtap\.so\.0\.[0-9]+\.[0-9]+' | grep -q . || { echo "::error::$pkg has no versioned libdrmtap"; exit 1; }
          [ -L /tmp/arch/usr/lib/rustdesk/libdrmtap.so.0 ] || { echo "::error::$pkg has no libdrmtap.so.0 symlink"; exit 1; }
          grep -qE '^conflict = rustdesk$' /tmp/arch/.PKGINFO || { echo "::error::$pkg does not conflict rustdesk"; exit 1; }
          file /tmp/arch/usr/share/rustdesk/lib/librustdesk.so /tmp/arch/usr/lib/rustdesk/libdrmtap.so.0.*
          grep -qF /usr/lib/rustdesk/libdrmtap.so.0 /tmp/arch/usr/share/rustdesk/lib/librustdesk.so || { echo "::error::$pkg binary is not a drm build"; exit 1; }
          sha256sum "$pkg" | tee "$pkg.sha256"
          echo "DRM_ARCH_PKG=$pkg" >> "$GITHUB_ENV"
        shell: bash

      - name: Upload deb
        if: always() && env.DRM_DEB != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DRM_DEB }}
          path: |
            ${{ env.DRM_DEB }}
            ${{ env.DRM_DEB }}.sha256

      - name: Upload rpm
        if: always() && env.DRM_RPM != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DRM_RPM }}
          path: |
            ${{ env.DRM_RPM }}
            ${{ env.DRM_RPM }}.sha256

      - name: Upload Arch package
        if: always() && env.DRM_ARCH_PKG != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DRM_ARCH_PKG }}
          path: |
            ${{ env.DRM_ARCH_PKG }}
            ${{ env.DRM_ARCH_PKG }}.sha256

      # One softprops step per artifact type, each always()-gated, so a failure building the rpm or
      # Arch package never blocks shipping the deb (or each other). Same tag: softprops appends.
      - name: Publish deb to GitHub release
        if: always() && env.RELEASE_TAG != '' && env.DRM_DEB != ''
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Pin the tag to the commit that was actually built. Without this a draft targets the
          # default branch, so publishing it later would tag whatever master had moved to by then.
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          draft: ${{ env.DRAFT }}
          files: |
            ${{ env.DRM_DEB }}
            ${{ env.DRM_DEB }}.sha256

      - name: Publish rpm to GitHub release
        if: always() && env.RELEASE_TAG != '' && env.DRM_RPM != ''
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          draft: ${{ env.DRAFT }}
          files: |
            ${{ env.DRM_RPM }}
            ${{ env.DRM_RPM }}.sha256

      - name: Publish Arch package to GitHub release
        if: always() && env.RELEASE_TAG != '' && env.DRM_ARCH_PKG != ''
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          draft: ${{ env.DRAFT }}
          files: |
            ${{ env.DRM_ARCH_PKG }}
            ${{ env.DRM_ARCH_PKG }}.sha256
