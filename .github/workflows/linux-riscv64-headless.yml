# Fork-only: R-DeskWay for riscv64, HEADLESS (no Flutter window), cross-built on x86_64.
#
# Flutter publishes no riscv64 engine for the version this tree pins (3.24.5), so this builds the
# non-Flutter binary with the drm backend: the unattended service, capture, ID/relay and input, set
# up from the command line. The whole build is branding/riscv64/build-headless.sh, runnable on any
# x86_64 Ubuntu 24.04; this file only adds the runner, Rust and the artifact.
#
# ARTIFACTS ONLY. Nothing is published: the riscv64 deb is attached to a release by hand, after it
# has run on real riscv64 hardware. (The unattended-wayland-ci workflow publishes on every push,
# which is why this lives on its own branch with its own trigger.)
name: Linux riscv64 R-DeskWay (headless)

on:
  push:
    branches: [r-deskway-riscv64]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riscv64-headless-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Rust as the other R-DeskWay builds (upstream flutter-build.yml's pin).
  RUST_VERSION: "1.75"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free space
        run: sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet && df -h /

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: riscv64gc-unknown-linux-gnu

      - name: Cross toolchain and riscv64 libraries
        run: branding/riscv64/build-headless.sh deps

      - name: libdrmtap (cross)
        run: branding/riscv64/build-headless.sh drmtap

      - name: rustdesk (cross)
        run: branding/riscv64/build-headless.sh cargo

      - name: Package
        run: branding/riscv64/build-headless.sh package

      - name: Upload the deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-deskway-riscv64
          path: r-deskway-*-riscv64.deb
          if-no-files-found: error
